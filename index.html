<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TCO Bypass</title>

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }

  textarea, select, button {
    margin: 8px 0;
    padding: 8px;
    width: 100%;
    max-width: 520px;
  }

  #output {
    margin-top: 15px;
    padding: 10px;
    border: 1px solid #ccc;
    min-height: 60px;
    word-break: break-word;
    white-space: pre-wrap;
  }

  button {
    width: 220px;
    cursor: pointer;
  }
</style>
</head>

<body>

<h3>TCO bypass</h3>

<textarea id="txt" placeholder="Type text..."></textarea>
<select id="font">
  <option value="">No font</option>

  <option value="Roboto">Roboto</option>
  <option value="RobotoCondensed">RobotoCondensed</option>
  <option value="Oswald">Oswald</option>
  <option value="Merriweather">Merriweather</option>
  <option value="Ubuntu">Ubuntu</option>
  <option value="Nunito">Nunito</option>
  <option value="IndieFlower">IndieFlower</option>
  <option value="Bangers">Bangers</option>
  <option value="AmaticSC">AmaticSC</option>
  <option value="PermanentMarker">PermanentMarker</option>
  <option value="PatrickHand">PatrickHand</option>
  <option value="Jura">Jura</option>
  <option value="JosefinSans">JosefinSans</option>
  <option value="GrenzeGotisch">GrenzeGotisch</option>
  <option value="FredokaOne">FredokaOne</option>
  <option value="DenkOne">DenkOne</option>

  <!-- added fonts -->
  <option value="Kalam">Kalam</option>
  <option value="LuckiestGuy">LuckiestGuy</option>
  <option value="TrilliumWeb">TrilliumWeb</option>
  <option value="SpecialElite">SpecialElite</option>
  <option value="Sarpanch">Sarpanch</option>
  <option value="SourceSansPro">SourceSansPro</option>
  <option value="Gotham">Gotham</option>
  <option value="EBGaramond">EBGaramond</option>
  <option value="BodoniModa">BodoniModa</option>
  <option value="Arial">Arial</option>
  <option value="Cinzel">Cinzel</option>
  <option value="CinzelDecorative">CinzelDecorative</option>
</select>

<button onclick="generate()">Bypass</button>
<button onclick="copyOutput()">Copy</button>

<div id="output"></div>
<hr>

<div style="font-size: 12px; color: #666; margin-top: 10px;">
  made by Normalxsx/2AreYouMental110, HTMLified by homertco(helloguys1768)
</div>
<script>
function generate() {
  const txt = document.getElementById("txt").value;
  const font = document.getElementById("font").value;

  if (!txt) {
    alert("There's nothing in the input!");
    return;
  }

  const alphabet = "acdefghjklmnopqrtvwxyz";
  const bypassmarkups = alphabet.split("");

  let returntxt = "";

  // Lua behavior: wrap entire output only if font is not empty
  if (font !== "") {
    returntxt += `<font face="${font}">`;
  }

  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i];

    if (i % 2 === 1) {
      returntxt += ch;
    } else {
      const tag = bypassmarkups[Math.floor(Math.random() * bypassmarkups.length)];
      returntxt += `<${tag}>${ch}</${tag}>`;
    }
  }

  if (font !== "") {
    returntxt += `</font>`;
  }

  document.getElementById("output").textContent = returntxt;
}

function copyOutput() {
  navigator.clipboard.writeText(
    document.getElementById("output").textContent
  );
}

document.getElementById("txt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.ctrlKey) {
    generate();
  }
});
</script>

</body>
</html>
