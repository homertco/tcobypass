<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCO Bypass</title>

<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #1f2937;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
    }
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px;
  }

  .container {
    width: 100%;
    max-width: 720px;
  }

  h3 {
    margin-bottom: 16px;
    font-weight: 600;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  }

  textarea, select {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    outline: none;
  }

  textarea {
    min-height: 120px;
    resize: vertical;
  }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  button {
    flex: 1;
    min-width: 140px;
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    background: var(--accent);
    color: white;
    transition: 0.2s ease;
  }

  button:hover {
    background: var(--accent-hover);
  }

  button.secondary {
    background: #374151;
  }

  button.secondary:hover {
    background: #111827;
  }

  #output {
    margin-top: 14px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    min-height: 80px;
    white-space: pre-wrap;
    word-break: break-word;
    background: rgba(0,0,0,0.02);
  }

  .footer {
    font-size: 12px;
    color: var(--muted);
    margin-top: 12px;
    text-align: center;
  }

  @media (max-width: 480px) {
    body {
      padding: 12px;
    }

    button {
      min-width: 100%;
    }
  }
</style>
</head>

<body>

<div class="container">
  <h3>TCO bypass</h3>

  <div class="card">
    <textarea id="txt" placeholder="Type text..."></textarea>

<select id="font">
  <option value="">No font</option>

  <option value="Roboto">Roboto</option>
  <option value="RobotoCondensed">Roboto Condensed</option>
  <option value="RobotoMono">Roboto Mono</option>

  <option value="Oswald">Oswald</option>
  <option value="Merriweather">Merriweather</option>
  <option value="Ubuntu">Ubuntu</option>
  <option value="Nunito">Nunito</option>

  <option value="IndieFlower">Indie Flower</option>
  <option value="Bangers">Bangers</option>
  <option value="AmaticSC">Amatic SC</option>
  <option value="PermanentMarker">Permanent Marker</option>
  <option value="PatrickHand">Patrick Hand</option>

  <option value="Jura">Jura</option>
  <option value="JosefinSans">Josefin Sans</option>
  <option value="GrenzeGotisch">Grenze Gotisch</option>
  <option value="FredokaOne">Fredoka One</option>
  <option value="Fondamento">Fondamento</option>

  <option value="DenkOne">Denk One</option>
  <option value="Creepster">Creepster</option>
  <option value="Kalam">Kalam</option>
  <option value="LuckiestGuy">Luckiest Guy</option>

  <option value="TitiliumWeb">Titillium Web</option>
  <option value="SpecialElite">Special Elite</option>
  <option value="Sarpanch">Sarpanch</option>
  <option value="SourceSansPro">Source Sans Pro</option>

  <option value="Gotham">Gotham</option>
  <option value="EBGaramond">EB Garamond</option>
  <option value="BodoniModa">Bodoni Moda</option>
  <option value="Arial">Arial</option>

  <option value="Cinzel">Cinzel</option>
  <option value="CinzelDecorative">Cinzel Decorative</option>
</select>
    <div class="controls">
      <button onclick="generate()">Bypass</button>
      <button class="secondary" onclick="copyOutput()">Copy</button>
    </div>

    <div id="output"></div>

    <div class="footer">
      made by Normalxsx/2AreYouMental110, HTMLified by homertco(helloguys1768)
    </div>
  </div>
</div>

<script>
function generate() {
  const txt = document.getElementById("txt").value;
  const font = document.getElementById("font").value;

  if (!txt) {
    alert("There's nothing in the input!");
    return;
  }

  const alphabet = "acdefghjklmnopqrtvwxyz";
  const bypassmarkups = alphabet.split("");

  let returntxt = "";

  if (font !== "") {
    returntxt += `<font face="${font}">`;
  }

  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i];

    if (i % 2 === 1) {
      returntxt += ch;
    } else {
      const tag = bypassmarkups[Math.floor(Math.random() * bypassmarkups.length)];
      returntxt += `<${tag}>${ch}</${tag}>`;
    }
  }

  if (font !== "") {
    returntxt += `</font>`;
  }

  document.getElementById("output").textContent = returntxt;
}

function copyOutput() {
  navigator.clipboard.writeText(
    document.getElementById("output").textContent
  );
}

document.getElementById("txt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.ctrlKey) {
    generate();
  }
});
</script>

</body>
</html>
